<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG2HPGL</title>
<style>
:root{--bg:#fff;--panel:#f2f2f2;--surface:#fff;--line:#cfcfcf;--soft:#e6e6e6;--text:#151515;--muted:#666;--active:#222;--danger:#a31313;--travel:#d2473f}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--bg);font-size:12px}button,input,select{font:inherit;color:inherit;border:1px solid #aaa;border-radius:6px;background:#fff;padding:5px 7px;min-width:0}button{cursor:pointer;background:#e9e9e9;min-height:28px}button:hover{background:#ddd}button.primary{background:var(--active);color:#fff;border-color:var(--active)}button:disabled{opacity:.42;cursor:not-allowed}input[type=file]{display:none}input[type=number]{width:100%}input[type=range]{padding:0}.app{height:100%;display:grid;grid-template-rows:42px minmax(0,1fr)}.topbar{display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--panel);border-bottom:1px solid var(--line)}.brand{font-size:17px;font-weight:700;margin-right:auto}.file-label{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);margin-right:5px}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;min-height:0}.sidebar{background:var(--panel);padding:8px;overflow:auto;min-width:0}.sidebar.left{border-right:1px solid var(--line)}.sidebar.right{border-left:1px solid var(--line)}details.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:7px}summary{font-weight:700;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;list-style:none;border-bottom:1px solid transparent;padding-bottom:2px}details[open] summary{border-color:var(--soft);margin-bottom:7px;padding-bottom:5px}summary::-webkit-details-marker{display:none}summary:before{content:'▸';display:inline-block;width:14px;color:#777}details[open] summary:before{content:'▾'}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.field{display:flex;flex-direction:column;gap:3px;margin-bottom:6px;min-width:0}.field small,.hint,.muted{color:var(--muted);line-height:1.3}.check{display:flex;align-items:center;gap:6px;margin:6px 0}.check input{margin:0}.status{padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);line-height:1.35}.status.dirty{color:#7a4b00;border-color:#d2a34f;background:#fff9e9}.status.error{color:var(--danger);border-color:#d99}.center{display:grid;grid-template-rows:35px minmax(0,1fr);min-width:0;min-height:0;background:#dedede}.tabs{display:flex;align-items:end;gap:2px;padding:5px 7px 0;background:var(--panel);border-bottom:1px solid var(--line)}.tab{border-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;min-height:29px}.tab.active{background:#dedede;position:relative;top:1px}.tab-spacer{flex:1}.zoom-readout{align-self:center;color:var(--muted);padding-right:4px}.viewport{overflow:auto;padding:22px;position:relative}.preview-stage{transform-origin:0 0;width:max-content;min-width:100%;display:flex;justify-content:center}.paper{background:#fff;box-shadow:0 2px 12px #0003;position:relative;overflow:hidden}.paper>svg{width:100%;height:100%;display:block}.original-holder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}.original-holder svg{width:100%;height:100%;display:block}.layer-head{display:flex;align-items:center;justify-content:space-between;margin:1px 2px 7px}.layer-head strong{text-transform:uppercase;letter-spacing:.04em}.layers-hint{margin:0 2px 7px}.layer{display:grid;grid-template-columns:14px 18px minmax(0,1fr) 52px 44px;gap:5px;align-items:center;padding:6px;margin-bottom:5px;background:#fff;border:1px solid var(--line);border-radius:7px}.layer.dragging{opacity:.45}.handle{color:#888;cursor:grab;font-size:16px}.swatch{width:13px;height:13px;border-radius:50%;border:1px solid #999}.layer-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer input[type=checkbox]{margin:0}.layer input[type=number]{padding:4px}.empty-layers{padding:14px;color:var(--muted);text-align:center;border:1px dashed #bbb;border-radius:7px}.code-view{position:absolute;inset:0;background:#fff;display:grid;grid-template-rows:34px minmax(0,1fr)}.code-head{display:flex;align-items:center;gap:10px;padding:5px 9px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.code-head .metrics{margin-left:auto;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}.fresh{color:#08722f}.stale{color:#9a5a00}.output{margin:0;border:0;resize:none;width:100%;height:100%;padding:12px 14px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto;outline:none}.hidden{display:none!important}@media(max-width:900px){.workspace{grid-template-columns:230px minmax(0,1fr) 245px}}@media(max-width:700px){html,body{overflow:auto}.app{height:auto;min-height:100%;display:block}.workspace{display:block}.sidebar{border:0!important}.center{height:500px}.topbar{flex-wrap:wrap;height:auto}.file-label{order:3;width:100%;max-width:none}}
.measure-host{position:fixed;left:-100000px;top:-100000px;width:1000px;height:1000px;opacity:0;pointer-events:none}
.sidebar.left{padding:0;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.left-actions{padding:8px;border-bottom:1px solid var(--line);display:grid;gap:6px}.left-actions .row button{width:100%}.left-scroll{padding:8px;overflow:auto;min-height:0}.left-footer{padding:8px;border-top:1px solid var(--line);display:grid;gap:7px;background:var(--panel)}.left-footer button{width:100%}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">SVG2HPGL</div><div id="fileLabel" class="file-label">No SVG loaded</div>
    <input id="svgInput" type="file" accept=".svg,image/svg+xml"><input id="projectInput" type="file" accept=".json,.svg2hpgl,application/json">
  </header>
  <div class="workspace">
    <aside class="sidebar left">
      <div class="left-actions"><button id="readSvg">Read SVG</button><div class="row"><button id="loadProject">Load Project</button><button id="saveProject" disabled>Save Project</button></div></div>
      <div class="left-scroll">
      <details class="panel" open><summary>Plotter Setup</summary>
        <div class="row"><label class="field"><span>Paper preset</span><select id="paper"><option value="letter-landscape">Letter landscape / PS4</option><option value="custom">Custom HPGL bounds</option></select></label><label class="field"><span>Init command</span><select id="initMode"><option value="INDFPS4">IN; DF; PS4;</option><option value="INDF">IN; DF;</option><option value="none">None</option></select></label></div>
        <div class="row"><label class="field"><span>HPGL min X</span><input id="minX" type="number" value="250"></label><label class="field"><span>HPGL min Y</span><input id="minY" type="number" value="596"></label></div>
        <div class="row"><label class="field"><span>HPGL max X</span><input id="maxX" type="number" value="10250"></label><label class="field"><span>HPGL max Y</span><input id="maxY" type="number" value="7796"></label></div>
        <label class="check"><input id="centerFit" type="checkbox" checked>Fit + center inside HPGL bounds</label><label class="check"><input id="flipY" type="checkbox" checked>Flip Y for plotter coordinates</label>
      </details>
      <details class="panel" open><summary>Sampling</summary>
        <label class="field"><span>Sampling distance</span><div class="row"><input id="spacing" type="number" min="0" step="0.05" value="0"><select id="spacingUnit"><option value="mm">mm</option><option value="svg">SVG units</option></select></div><small>0 = automatic. Millimeters refer to the final size on paper.</small></label>
        <div class="row"><label class="field"><span>Max points / path</span><input id="maxPathPts" type="number" min="10" step="10" value="1200"></label><label class="field"><span>Max total points</span><input id="maxTotalPts" type="number" min="100" step="100" value="25000"></label></div>
        <label class="field"><span>PD command mode</span><select id="pdMode"><option value="point">One command per point</option><option value="chunk">Chunked coordinates</option><option value="path">Single command per path — at your own risk</option></select></label>
        <label id="chunkField" class="field hidden"><span>Coordinate pairs / chunk</span><input id="chunkSize" type="number" min="2" max="500" value="64"><small>64 is a conservative starting point.</small></label>
      </details>
      <details class="panel" open><summary>Preview</summary>
        <label class="field"><span>Zoom: <b id="zoomValue">100%</b></span><input id="zoom" type="range" min="25" max="300" step="5" value="100"></label>
        <label class="field"><span>Simulate pen width</span><select id="penWidth"><option value="0">Off / hairline</option><option value="0.25">0.25 mm</option><option value="0.5">0.5 mm</option><option value="1">1 mm</option></select></label>
        <label class="check"><input id="showPaper" type="checkbox" checked>Show paper boundary</label><label class="check"><input id="connectPaths" type="checkbox" checked>Connect consecutive paths in travel view</label>
      </details>
      </div>
      <div class="left-footer"><div id="status" class="status">Load an SVG to begin.</div><div class="row"><button id="generate" class="primary" disabled>Generate</button><button id="download" disabled>Download HPGL</button></div></div>
    </aside>
    <main class="center">
      <nav class="tabs" aria-label="Preview mode"><button class="tab active" data-view="svg">SVG</button><button class="tab" data-view="hpgl">HPGL</button><button class="tab" data-view="travel">Pen-up Travel</button><button class="tab" data-view="points">Points</button><button class="tab" data-view="code">HPGL Code</button></nav>
      <div id="viewport" class="viewport"><div id="stage" class="preview-stage"><div id="paperFrame" class="paper"><div id="svgView" class="original-holder"></div><div id="generatedView" class="hidden" style="width:100%;height:100%"></div></div></div><div id="codeView" class="code-view hidden"><div class="code-head"><span>HPGL Code</span><span id="freshness" class="stale">Not generated</span><span id="metrics" class="metrics"></span></div><textarea id="output" class="output" spellcheck="false" placeholder="Generated HPGL will appear here."></textarea></div></div>
    </main>
    <aside class="sidebar right">
      <div class="layer-head"><strong>Layers / Pens</strong><span id="layerCount" class="muted"></span></div><p class="layers-hint hint">Top layer plots first. Drag to reorder; its position assigns the initial pen number.</p><div id="layers"><div class="empty-layers">Load an SVG to inspect its layers.</div></div>
    </aside>
  </div>
</div>
<div id="measureHost" class="measure-host" aria-hidden="true"></div>
<script>
'use strict';
const HPGL_PER_MM=40, NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
let svgText='',liveSvg=null,layers=[],dragIndex=null,lastHPGL='',lastPaths=[],activeView='svg',isDirty=false,currentName='plot.svg',limitedPaths=0,gestureBaseZoom=1;
const settingIds=['paper','initMode','minX','minY','maxX','maxY','centerFit','flipY','spacing','spacingUnit','maxPathPts','maxTotalPts','pdMode','chunkSize'];
const previewIds=['zoom','penWidth','showPaper','connectPaths'];
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function setStatus(msg,type=''){const el=$('status');el.textContent=msg;el.className='status'+(type?' '+type:'');}
function markDirty(){if(!liveSvg)return;isDirty=true;$('freshness').textContent='Settings changed — Generate again';$('freshness').className='stale';$('download').disabled=true;setStatus('Settings changed — generate again.','dirty');}
function markFresh(){isDirty=false;$('freshness').textContent='Up to date';$('freshness').className='fresh';$('download').disabled=false;}
function paperBounds(){return {minX:+$('minX').value,minY:+$('minY').value,maxX:+$('maxX').value,maxY:+$('maxY').value};}
function validBounds(){const b=paperBounds();return [b.minX,b.minY,b.maxX,b.maxY].every(Number.isFinite)&&b.maxX>b.minX&&b.maxY>b.minY;}
function updatePaperFrame(){const b=paperBounds(),w=Math.max(1,b.maxX-b.minX),h=Math.max(1,b.maxY-b.minY);$('paperFrame').dataset.ratio=String(h/w);$('paperFrame').style.boxShadow=$('showPaper').checked?'0 2px 12px #0003':'none';$('paperFrame').style.background=$('showPaper').checked?'#fff':'transparent';applyZoom();}
function applyZoom(percent=+$('zoom').value,clientX=null,clientY=null){const vp=$('viewport');if(activeView==='code')return;const oldZ=+(vp.dataset.zoom||1),next=Math.max(25,Math.min(300,Number(percent)||100)),newZ=next/100,rect=vp.getBoundingClientRect(),focusX=clientX===null?rect.width/2:clientX-rect.left,focusY=clientY===null?rect.height/2:clientY-rect.top,contentX=vp.scrollLeft+focusX,contentY=vp.scrollTop+focusY,ratio=+$('paperFrame').dataset.ratio||.75,basePaperWidth=720;$('zoom').value=String(next);$('zoomValue').textContent=Math.round(next)+'%';$('paperFrame').style.width=(basePaperWidth*newZ)+'px';$('paperFrame').style.height=(basePaperWidth*ratio*newZ)+'px';vp.dataset.zoom=String(newZ);requestAnimationFrame(()=>{vp.scrollLeft=Math.max(0,contentX*(newZ/oldZ)-focusX);vp.scrollTop=Math.max(0,contentY*(newZ/oldZ)-focusY)});}
function loadSVG(text,name='plot.svg',savedLayers=null){
  const parser=new DOMParser(),doc=parser.parseFromString(text,'image/svg+xml');if(doc.querySelector('parsererror')){setStatus('SVG parse error.','error');return false;}const source=doc.documentElement;if(!source||source.tagName.toLowerCase()!=='svg'){setStatus('No <svg> element found.','error');return false;}
  svgText=text;currentName=name;lastHPGL='';lastPaths=[];$('output').value='';$('metrics').textContent='';$('generatedView').innerHTML='';$('fileLabel').textContent=name;
  const measurement=document.importNode(source,true),preview=document.importNode(source,true);$('measureHost').innerHTML='';$('measureHost').appendChild(measurement);liveSvg=measurement;preview.removeAttribute('width');preview.removeAttribute('height');preview.style.width='100%';preview.style.height='100%';preview.style.overflow='visible';preview.setAttribute('preserveAspectRatio','xMidYMid meet');$('svgView').innerHTML='';$('svgView').appendChild(preview);fitPreviewSVG(preview);
  detectLayers(savedLayers);renderLayers();$('generate').disabled=false;$('saveProject').disabled=false;$('download').disabled=true;updatePaperFrame();switchView('svg');isDirty=true;$('freshness').textContent='Not generated';$('freshness').className='stale';setStatus(`Loaded ${layers.length} layer${layers.length===1?'':'s'}. Ready to generate.`);return true;
}
function fitPreviewSVG(svg){try{const b=svg.getBBox();if(Number.isFinite(b.x)&&Number.isFinite(b.y)&&b.width>0&&b.height>0){const pad=Math.max(b.width,b.height)*.025;svg.setAttribute('viewBox',`${b.x-pad} ${b.y-pad} ${b.width+pad*2} ${b.height+pad*2}`)}}catch(e){}}
function layerLabel(el,i){return el.getAttribute('inkscape:label')||el.getAttribute('data-name')||el.id||`Layer ${i+1}`;}
function drawableSelector(){return 'path,line,polyline,polygon,rect,circle,ellipse';}
function countDrawable(el){return el.querySelectorAll(drawableSelector()).length;}
function guessColor(el,i){const p=el.querySelector(drawableSelector()),style=p?getComputedStyle(p):null,c=(p&&(p.getAttribute('stroke')||p.getAttribute('fill')))||(style&&(style.stroke!=='none'?style.stroke:style.fill))||['#111','#c33','#1672c4','#27833a','#c66b18','#8a3da1','#13888b','#666'][i%8];return (!c||c==='none'||String(c).startsWith('url'))?'#111':c;}
function detectLayers(saved){
  let candidates=[...liveSvg.children].filter(el=>el.tagName.toLowerCase()==='g'&&countDrawable(el)>0).reverse();if(!candidates.length)candidates=[liveSvg];layers=candidates.map((el,i)=>({el,name:layerLabel(el,i),pen:Math.min(i+1,8),enabled:true,color:guessColor(el,i),count:countDrawable(el)}));
  if(saved&&Array.isArray(saved)){const unused=[...layers],restored=[];for(const s of saved){let idx=unused.findIndex(l=>l.name===s.name);if(idx<0)continue;const l=unused.splice(idx,1)[0];l.pen=Math.max(1,Math.min(8,+s.pen||1));l.enabled=s.enabled!==false;restored.push(l);}layers=[...restored,...unused];}
}
function renderLayers(){const box=$('layers');box.innerHTML='';$('layerCount').textContent=layers.length?`${layers.length} total`:'';if(!layers.length){box.innerHTML='<div class="empty-layers">No drawable layers found.</div>';return;}layers.forEach((l,i)=>{const div=document.createElement('div');div.className='layer';div.draggable=true;div.innerHTML=`<span class="handle">⋮⋮</span><span class="swatch" style="background:${esc(l.color)}"></span><span class="layer-name" title="${esc(l.name)}">${i+1}. ${esc(l.name)} <span class="muted">(${l.count})</span></span><input type="number" min="1" max="8" value="${l.pen}" aria-label="Pen number"><input type="checkbox" ${l.enabled?'checked':''} aria-label="Layer enabled">`;div.ondragstart=()=>{dragIndex=i;div.classList.add('dragging')};div.ondragend=()=>{dragIndex=null;div.classList.remove('dragging')};div.ondragover=e=>e.preventDefault();div.ondrop=e=>{e.preventDefault();if(dragIndex===null||dragIndex===i)return;const item=layers.splice(dragIndex,1)[0];layers.splice(i,0,item);renderLayers();markDirty()};const inputs=div.querySelectorAll('input');inputs[0].onchange=e=>{l.pen=Math.max(1,Math.min(8,+e.target.value||1));e.target.value=l.pen;markDirty()};inputs[1].onchange=e=>{l.enabled=e.target.checked;markDirty()};box.appendChild(div);});}
function matrixPoint(el,p){const m=el.getCTM();if(!m)return p;const q=liveSvg.createSVGPoint();q.x=p.x;q.y=p.y;const r=q.matrixTransform(m);return{x:r.x,y:r.y};}
function matrixScale(el){const m=el.getCTM();return m?Math.sqrt((m.a*m.a+m.b*m.b+m.c*m.c+m.d*m.d)/2):1;}
function pathPoints(path,spacing,maxPts){let len=0;try{len=path.getTotalLength()}catch(e){return[]}if(!isFinite(len)||len<=0)return[];const wanted=spacing>0?Math.ceil(len/spacing):Math.ceil(len/4),n=Math.min(maxPts,Math.max(2,wanted));if(wanted>maxPts)limitedPaths++;const pts=[];for(let i=0;i<=n;i++){const p=path.getPointAtLength(len*i/n);if(!pts.length||Math.hypot(p.x-pts.at(-1).x,p.y-pts.at(-1).y)>.01)pts.push({x:p.x,y:p.y});}return pts;}
function parsePointList(raw){const nums=(raw.match(/[-+]?(?:\d*\.)?\d+(?:[eE][-+]?\d+)?/g)||[]).map(Number),pts=[];for(let i=0;i+1<nums.length;i+=2)pts.push({x:nums[i],y:nums[i+1]});return pts;}
function shapePoints(el,spacing,maxPts){const tag=el.tagName.toLowerCase();if(tag==='path')return pathPoints(el,spacing,maxPts);if(tag==='line')return[{x:+el.getAttribute('x1')||0,y:+el.getAttribute('y1')||0},{x:+el.getAttribute('x2')||0,y:+el.getAttribute('y2')||0}];if(tag==='polyline'||tag==='polygon'){const pts=parsePointList(el.getAttribute('points')||'');if(tag==='polygon'&&pts.length)pts.push({...pts[0]});return pts}if(tag==='rect'){const x=+el.getAttribute('x')||0,y=+el.getAttribute('y')||0,w=+el.getAttribute('width')||0,h=+el.getAttribute('height')||0;return[{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h},{x,y}]}if(tag==='circle'||tag==='ellipse'){const cx=+el.getAttribute('cx')||0,cy=+el.getAttribute('cy')||0,rx=tag==='circle'?(+el.getAttribute('r')||0):(+el.getAttribute('rx')||0),ry=tag==='circle'?rx:(+el.getAttribute('ry')||0),circ=2*Math.PI*Math.max(rx,ry),wanted=spacing>0?Math.ceil(circ/spacing):Math.ceil(circ/4),n=Math.min(maxPts,Math.max(16,wanted));if(wanted>maxPts)limitedPaths++;return Array.from({length:n+1},(_,i)=>{const a=2*Math.PI*i/n;return{x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry}})}return[];}
function collectGeometry(spacingResolver,maxPts){const result=[];for(const layer of layers){if(!layer.enabled)continue;for(const el of layer.el.querySelectorAll(drawableSelector())){const cs=getComputedStyle(el);if(cs.display==='none'||cs.visibility==='hidden')continue;const localSpacing=spacingResolver?spacingResolver(el):0,pts=shapePoints(el,localSpacing,maxPts);if(pts.length>=2)result.push({pts:pts.map(p=>matrixPoint(el,p)),layer,color:layer.color,pen:layer.pen});}}return result;}
function geometryBounds(geometry){const xs=[],ys=[];for(const g of geometry)for(const p of g.pts){if(Number.isFinite(p.x)&&Number.isFinite(p.y)){xs.push(p.x);ys.push(p.y)}}if(!xs.length)return null;return{x:Math.min(...xs),y:Math.min(...ys),width:Math.max(...xs)-Math.min(...xs),height:Math.max(...ys)-Math.min(...ys)};}
function outputTransform(bounds){const p=paperBounds(),w=p.maxX-p.minX,h=p.maxY-p.minY,sx=w/bounds.width,sy=h/bounds.height,s=$('centerFit').checked?Math.min(sx,sy):sx,ox=p.minX+(w-bounds.width*s)/2-bounds.x*s,oy=p.minY+(h-bounds.height*s)/2-bounds.y*s;return{scale:s,point(q){let x=q.x*s+ox,y=q.y*s+oy;if($('flipY').checked)y=p.maxY-(y-p.minY);return[Math.round(x),Math.round(y)]}};}
function generateHPGL(){
  if(!liveSvg)return;if(!validBounds()){setStatus('Invalid HPGL bounds.','error');return;}limitedPaths=0;const maxPts=Math.max(10,+$('maxPathPts').value||1200),maxTotal=Math.max(100,+$('maxTotalPts').value||25000);
  const probe=collectGeometry(null,Math.min(maxPts,1500)),probeBounds=geometryBounds(probe);if(!probeBounds||probeBounds.width<=0||probeBounds.height<=0){setStatus('No drawable geometry found.','error');return;}const preliminary=outputTransform(probeBounds),requested=+$('spacing').value||0,unit=$('spacingUnit').value;
  const resolver=el=>{if(requested<=0)return 0;if(unit==='svg')return requested;const transformedSpacing=requested*HPGL_PER_MM/preliminary.scale;return transformedSpacing/Math.max(.0001,matrixScale(el));};
  limitedPaths=0;const geometry=collectGeometry(resolver,maxPts),bounds=geometryBounds(geometry);if(!bounds){setStatus('No drawable geometry found.','error');return;}const tr=outputTransform(bounds),paths=[];let total=0;for(const g of geometry){const hp=g.pts.map(tr.point);total+=hp.length;if(total>maxTotal){setStatus(`Too many points (${total}). Increase sampling distance or maximum total points.`,'error');return;}paths.push({pts:hp,color:g.color,pen:g.pen,layer:g.layer.name});}
  const out=[],init=$('initMode').value;if(init==='INDFPS4')out.push('IN;','DF;','PS4;','');else if(init==='INDF')out.push('IN;','DF;','');let currentPen=null;for(const p of paths){if(p.pen!==currentPen){out.push(`SP${p.pen};`);currentPen=p.pen}out.push(`PU${p.pts[0][0]},${p.pts[0][1]};`);const rest=p.pts.slice(1),mode=$('pdMode').value;if(mode==='point'){for(const q of rest)out.push(`PD${q[0]},${q[1]};`)}else if(mode==='chunk'){const n=Math.max(2,Math.min(500,+$('chunkSize').value||64));for(let i=0;i<rest.length;i+=n)out.push('PD'+rest.slice(i,i+n).map(q=>q.join(',')).join(',')+';')}else if(rest.length)out.push('PD'+rest.map(q=>q.join(',')).join(',')+';');out.push('PU;','');}out.push('SP0;');
  lastHPGL=out.join('\n');lastPaths=paths;$('output').value=lastHPGL;const warning=limitedPaths?` · ${limitedPaths} path${limitedPaths===1?'':'s'} limited`:'';$('metrics').textContent=`${paths.length} paths · ${total} points · ${lastHPGL.length.toLocaleString()} chars${warning}`;markFresh();setStatus(`Generated successfully.${limitedPaths?` ${limitedPaths} path${limitedPaths===1?' was':'s were'} capped by the point limit.`:''}`);renderGeneratedView();switchView(activeView==='svg'?'hpgl':activeView);
}
function makePreviewSVG(mode){const b=paperBounds(),w=b.maxX-b.minX,h=b.maxY-b.minY,svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`${b.minX} ${b.minY} ${w} ${h}`);svg.setAttribute('preserveAspectRatio','none');const penMm=+$('penWidth').value||0,sw=penMm?penMm*HPGL_PER_MM:Math.max(5,w/1200);if(mode==='travel'&&$('connectPaths').checked){for(let i=1;i<lastPaths.length;i++){const prev=lastPaths[i-1].pts.at(-1),next=lastPaths[i].pts[0],line=document.createElementNS(NS,'line');line.setAttribute('x1',prev[0]);line.setAttribute('y1',prev[1]);line.setAttribute('x2',next[0]);line.setAttribute('y2',next[1]);line.setAttribute('stroke','var(--travel)');line.setAttribute('stroke-width',Math.max(6,w/1000));line.setAttribute('stroke-dasharray',`${w/250},${w/250}`);line.setAttribute('opacity','.75');svg.appendChild(line)}}for(const p of lastPaths){const poly=document.createElementNS(NS,'polyline');poly.setAttribute('points',p.pts.map(q=>q.join(',')).join(' '));poly.setAttribute('fill','none');poly.setAttribute('stroke',p.color||'#111');poly.setAttribute('stroke-width',sw);poly.setAttribute('stroke-linecap','round');poly.setAttribute('stroke-linejoin','round');svg.appendChild(poly);if(mode==='points'){for(const q of p.pts){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1]);c.setAttribute('r',Math.max(10,w/650));c.setAttribute('fill','#e32626');svg.appendChild(c)}}}return svg;}
function renderGeneratedView(){if(!lastPaths.length||activeView==='code')return;const box=$('generatedView');box.innerHTML='';box.appendChild(makePreviewSVG(activeView));}
function switchView(view){activeView=view;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const original=view==='svg',code=view==='code';$('stage').classList.toggle('hidden',code);$('codeView').classList.toggle('hidden',!code);$('svgView').classList.toggle('hidden',!original);$('generatedView').classList.toggle('hidden',original||code);if(!original&&!code){if(!lastPaths.length){$('generatedView').innerHTML='<div style="display:grid;place-items:center;height:100%;color:#666">Generate HPGL to view this preview.</div>'}else renderGeneratedView();}}
function snapshotSettings(){const o={};for(const id of [...settingIds,...previewIds]){const e=$(id);o[id]=e.type==='checkbox'?e.checked:e.value}return o;}
function restoreSettings(o){if(!o)return;for(const [id,v] of Object.entries(o)){const e=$(id);if(!e)continue;if(e.type==='checkbox')e.checked=!!v;else e.value=v}$('chunkField').classList.toggle('hidden',$('pdMode').value!=='chunk');updatePaperFrame();}
function saveProject(){if(!liveSvg)return;downloadBlob(JSON.stringify({type:'SVG2HPGL Project',version:1,name:currentName,svg:svgText,settings:snapshotSettings(),layers:layers.map(l=>({name:l.name,pen:l.pen,enabled:l.enabled}))},null,2),projectBaseName()+'.svg2hpgl','application/json');}
function projectBaseName(){return currentName.replace(/\.[^.]+$/,'')||'plot';}
function timestamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;}
function downloadBlob(text,name,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadHPGL(){if(!lastHPGL||isDirty)return;downloadBlob($('output').value,`plot-${timestamp()}.hpgl`);}
$('readSvg').onclick=()=>$('svgInput').click();$('loadProject').onclick=()=>$('projectInput').click();$('svgInput').onchange=async e=>{const f=e.target.files[0];if(f)loadSVG(await f.text(),f.name);e.target.value=''};$('projectInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p.svg)throw new Error('Missing embedded SVG');restoreSettings(p.settings);loadSVG(p.svg,p.name||'plot.svg',p.layers);setStatus('Project loaded. Generate HPGL when ready.')}catch(err){setStatus('Invalid SVG2HPGL project: '+err.message,'error')}e.target.value=''};
$('saveProject').onclick=saveProject;$('generate').onclick=generateHPGL;$('download').onclick=downloadHPGL;$('paper').onchange=()=>{if($('paper').value==='letter-landscape'){Object.assign($('minX'),{value:250});Object.assign($('minY'),{value:596});Object.assign($('maxX'),{value:10250});Object.assign($('maxY'),{value:7796})}updatePaperFrame();markDirty()};
for(const id of settingIds.filter(id=>id!=='paper'))$(id).addEventListener('input',()=>{if(id==='pdMode')$('chunkField').classList.toggle('hidden',$('pdMode').value!=='chunk');if(['minX','minY','maxX','maxY'].includes(id))updatePaperFrame();markDirty()});for(const id of previewIds)$(id).addEventListener('input',()=>{if(id==='zoom')applyZoom();else{if(id==='showPaper')updatePaperFrame();if(lastPaths&&activeView!=='svg'&&activeView!=='code')renderGeneratedView()}});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('output').addEventListener('input',()=>{if(lastHPGL){lastHPGL=$('output').value;$('freshness').textContent='HPGL edited manually';$('freshness').className='fresh'}});$('viewport').addEventListener('wheel',e=>{if(activeView==='code'||!e.ctrlKey)return;e.preventDefault();const current=+( $('viewport').dataset.zoom||1),factor=Math.exp(-e.deltaY*.012);applyZoom(current*factor*100,e.clientX,e.clientY)},{passive:false});$('viewport').addEventListener('gesturestart',e=>{if(activeView==='code')return;e.preventDefault();gestureBaseZoom=+( $('viewport').dataset.zoom||1)},{passive:false});$('viewport').addEventListener('gesturechange',e=>{if(activeView==='code')return;e.preventDefault();applyZoom(gestureBaseZoom*e.scale*100,e.clientX,e.clientY)},{passive:false});updatePaperFrame();
</script>
