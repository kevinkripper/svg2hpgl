<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVG2HPGL Stable</title>
<style>
:root{--panel:#f4f4f4;--line:#d4d4d4;--muted:#666;--control:#fff;--blue:#0a84ff}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111;display:grid;grid-template-columns:350px minmax(0,1fr);height:100vh;overflow:hidden} aside{padding:9px;background:var(--panel);border-right:1px solid #ccc;overflow:auto} main{display:grid;grid-template-rows:minmax(0,1fr) 260px;height:100vh;min-width:0} h1{font-size:18px;margin:0 0 5px}.hint{font-size:12px;color:#555;line-height:1.35;margin:0 0 8px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin:0 0 7px;box-shadow:0 1px 0 rgba(0,0,0,.03)}.section-title{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#444;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid #e5e5e5;cursor:pointer;list-style:none}.section-title::-webkit-details-marker{display:none}details>.section-title:before{content:'▸';display:inline-block;width:14px;color:#777}details[open]>.section-title:before{content:'▾'}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.field{display:flex;flex-direction:column;gap:3px;margin:0 0 6px;font-size:12px;color:#222;min-width:0}.field span{line-height:1.15}.field small{font-size:11px;color:#666;line-height:1.25}input,button,select,textarea{font:inherit;padding:5px 7px;border-radius:7px;border:1px solid #aaa;background:var(--control);color:#111;max-width:100%;min-width:0}button{cursor:pointer;background:#e9e9e9;font-size:12px;padding:5px 8px;min-height:28px}button:hover{background:#ddd}input[type=file]{display:none}input[type=number]{width:100%}textarea{width:100%;height:100%;resize:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;border-radius:0;border-left:0;border-right:0;border-bottom:0}.file-display{display:flex;align-items:center;justify-content:center;width:100%;height:29px;padding:5px 7px;border-radius:7px;border:1px solid #aaa;background:#fff;color:#111;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.layer{display:grid;grid-template-columns:20px 1fr 58px 54px;gap:5px;align-items:center;border:1px solid #ddd;border-radius:7px;padding:5px;margin:4px 0;background:#fafafa;font-size:12px}.layer.dragging{opacity:.45}.layer-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.swatch{width:16px;height:16px;border:1px solid #aaa;border-radius:50%;display:inline-block}.check{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:12px}.preview-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0}.preview-panel{min-width:0;min-height:0;border-right:1px solid #ddd;display:grid;grid-template-rows:28px minmax(0,1fr)}.preview-title{font-size:12px;font-weight:700;background:#f4f4f4;border-bottom:1px solid #ddd;padding:7px 9px;text-transform:uppercase;letter-spacing:.04em}.preview-box{overflow:auto;position:relative;background:#fff;padding:18px}.preview-box svg{max-width:none;display:block}.status{font-size:12px;color:#555;margin-top:6px;line-height:1.35}.danger{color:#a00000}.title-divider{height:1px;background:#d9d9d9;margin:10px 0 12px}.muted{color:#666}.smallbtn{padding:3px 6px;min-height:24px}.output-head{display:flex;align-items:center;justify-content:space-between;background:#f4f4f4;border-top:1px solid #ddd;border-bottom:1px solid #ddd;padding:5px 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.output-pane{display:grid;grid-template-rows:29px minmax(0,1fr);min-height:0}.hidden{display:none}
</style>
</head>
<body>
<aside>
  <h1>SVG2HPGL</h1>
  <p class="hint">SVG layers to pen-by-pen HPGL. Stable mode: nothing heavy runs until Generate.</p>
  <div class="title-divider"></div>
  <section class="panel">
    <input id="fileInput" type="file" accept=".svg,image/svg+xml" />
    <div id="fileName" class="file-display">No SVG chosen</div>
    <div class="row3" style="margin-top:8px">
      <button id="read" type="button">↑ Read</button>
      <button id="generate" type="button">Generate</button>
      <button id="download" type="button">↓ HPGL</button>
    </div>
    <div id="status" class="status">Load an SVG first.</div>
  </section>

  <details class="panel" open>
    <summary class="section-title">Plotter Setup</summary>
    <div class="row">
      <label class="field"><span>Paper preset</span><select id="paper"><option value="letter-landscape" selected>Letter landscape / PS4</option><option value="custom">Custom HPGL bounds</option></select></label>
      <label class="field"><span>Init command</span><select id="initMode"><option value="INDFPS4" selected>IN; DF; PS4;</option><option value="INDF">IN; DF;</option><option value="none">None</option></select></label>
    </div>
    <div class="row">
      <label class="field"><span>HPGL min X</span><input id="minX" type="number" value="250" /></label>
      <label class="field"><span>HPGL min Y</span><input id="minY" type="number" value="596" /></label>
    </div>
    <div class="row">
      <label class="field"><span>HPGL max X</span><input id="maxX" type="number" value="10250" /></label>
      <label class="field"><span>HPGL max Y</span><input id="maxY" type="number" value="7796" /></label>
    </div>
    <label class="check"><input id="centerFit" type="checkbox" checked /> Fit + center SVG inside HPGL bounds</label>
    <label class="check"><input id="flipY" type="checkbox" checked /> Flip Y for plotter coordinates</label>
  </details>

  <details class="panel" open>
    <summary class="section-title">Sampling</summary>
    <label class="field"><span>Path sampling distance</span><input id="spacing" type="number" min="0" step="0.5" value="0" /><small>Distance between generated points in SVG units. 0 = auto/safe. Lower = smoother but more commands.</small></label>
    <div class="row">
      <label class="field"><span>Max points / path</span><input id="maxPathPts" type="number" min="10" step="10" value="1200" /><small>Hard limit so browser cannot freeze.</small></label>
      <label class="field"><span>Max total points</span><input id="maxTotalPts" type="number" min="100" step="100" value="25000" /><small>Stops conversion if SVG is too dense.</small></label>
    </div>
    <label class="check"><input id="onePD" type="checkbox" checked /> One PD x,y; command per point</label>
  </details>

  <details class="panel" open>
    <summary class="section-title">Preview</summary>
    <label class="field"><span>Preview zoom</span><input id="zoom" type="range" min="25" max="300" step="5" value="100" /></label>
    <label class="field"><span>Simulate pen width</span><select id="penWidth"><option value="0" selected>Off / hairline</option><option value="0.25">0.25 mm</option><option value="0.5">0.5 mm</option><option value="1">1 mm</option></select><small>Visual only. HPGL stores centerlines, not real line thickness.</small></label>
    <label class="check"><input id="showHpglPreview" type="checkbox" checked /> Draw HPGL preview after Generate</label>
  </details>

  <details class="panel" open>
    <summary class="section-title">Layers / Pens</summary>
    <p class="hint">Drag to reorder. Sequence is top to bottom. Each layer becomes SP pen number.</p>
    <div id="layers"></div>
  </details>
</aside>
<main>
  <div class="preview-wrap">
    <div class="preview-panel"><div class="preview-title">SVG Preview</div><div id="svgPreview" class="preview-box"></div></div>
    <div class="preview-panel"><div class="preview-title">HPGL Preview</div><div id="hpglPreview" class="preview-box"></div></div>
  </div>
  <div class="output-pane">
    <div class="output-head"><span>HPGL Output</span><span id="countInfo" class="muted"></span></div>
    <textarea id="output" spellcheck="false"></textarea>
  </div>
</main>
<script>
let svgText='', svgDoc=null, liveSvg=null, layers=[], dragIndex=null, lastHPGL='';
const $=id=>document.getElementById(id);
function setStatus(msg, danger=false){ $('status').innerHTML=msg; $('status').className='status'+(danger?' danger':''); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
$('read').onclick=()=>$('fileInput').click();
$('fileInput').onchange=async()=>{ const f=$('fileInput').files[0]; if(!f)return; $('fileName').textContent=f.name; svgText=await f.text(); loadSVG(svgText); };
['zoom','penWidth'].forEach(id=>$(id).addEventListener('input',()=>{applyZoom(); if(lastHPGL) drawHPGLPreview(window.lastPaths||[]);}));
$('paper').addEventListener('change',()=>{ if($('paper').value==='letter-landscape'){ $('minX').value=250; $('minY').value=596; $('maxX').value=10250; $('maxY').value=7796; }});
$('generate').onclick=generateHPGL;
$('download').onclick=downloadHPGL;
function loadSVG(text){
  lastHPGL=''; $('output').value=''; $('countInfo').textContent=''; $('hpglPreview').innerHTML='';
  const parser=new DOMParser(); svgDoc=parser.parseFromString(text,'image/svg+xml');
  const err=svgDoc.querySelector('parsererror'); if(err){ setStatus('SVG parse error.',true); return; }
  const preview=$('svgPreview'); preview.innerHTML='';
  const wrap=document.createElement('div'); wrap.innerHTML=text; liveSvg=wrap.querySelector('svg');
  if(!liveSvg){ setStatus('No <svg> found.',true); return; }
  preview.appendChild(liveSvg);
  liveSvg.removeAttribute('width'); liveSvg.removeAttribute('height'); liveSvg.style.overflow='visible';
  detectLayers(); renderLayers(); applyZoom(); setStatus(`Loaded ${layers.length} layer(s). Click Generate when ready.`);
}
function detectLayers(){
  layers=[]; if(!liveSvg)return;
  let candidates=[...liveSvg.children].filter(el=>el.tagName.toLowerCase()==='g');
  if(!candidates.length) candidates=[liveSvg];
  candidates.forEach((el,i)=>{
    const paths=countDrawable(el);
    if(paths>0) layers.push({el,name:el.id||el.getAttribute('inkscape:label')||`Layer ${i+1}`,pen:Math.min(i+1,8),enabled:true,color:guessColor(el,i),count:paths});
  });
  if(!layers.length) layers=[{el:liveSvg,name:'Layer 1',pen:1,enabled:true,color:'#000000',count:0}];
}
function countDrawable(el){ return el.querySelectorAll('path,line,polyline,polygon,rect,circle,ellipse').length; }
function guessColor(el,i){ const p=el.querySelector('path,line,polyline,polygon,rect,circle,ellipse'); const c=(p&&(p.getAttribute('stroke')||p.getAttribute('fill'))) || ['#000000','#d00','#06c','#080','#c60','#909','#099','#666'][i%8]; return (!c||c==='none'||c.startsWith('url'))?'#000000':c; }
function renderLayers(){
  const box=$('layers'); box.innerHTML='';
  layers.forEach((l,i)=>{
    const div=document.createElement('div'); div.className='layer'; div.draggable=true; div.dataset.i=i;
    div.innerHTML=`<span class="swatch" style="background:${esc(l.color)}"></span><span class="layer-name" title="${esc(l.name)}">${i+1}. ${esc(l.name)} <span class="muted">(${l.count})</span></span><input type="number" min="0" max="8" value="${l.pen}" title="Pen"/><label class="check" style="margin:0"><input type="checkbox" ${l.enabled?'checked':''}/> on</label>`;
    div.ondragstart=()=>{dragIndex=i; div.classList.add('dragging')}; div.ondragend=()=>div.classList.remove('dragging');
    div.ondragover=e=>e.preventDefault(); div.ondrop=e=>{e.preventDefault(); if(dragIndex===null||dragIndex===i)return; const item=layers.splice(dragIndex,1)[0]; layers.splice(i,0,item); dragIndex=null; renderLayers();};
    div.querySelector('input[type=number]').onchange=e=>l.pen=Math.max(0,Math.min(8,Number(e.target.value)||0));
    div.querySelector('input[type=checkbox]').onchange=e=>l.enabled=e.target.checked;
    box.appendChild(div);
  });
}
function applyZoom(){ const z=(Number($('zoom').value)||100)/100; ['svgPreview','hpglPreview'].forEach(id=>{ const s=$(id).querySelector('svg'); if(s){s.style.transformOrigin='0 0'; s.style.transform=`scale(${z})`;}}); }
function bboxOfSVG(){
  try{ const b=liveSvg.getBBox(); if(isFinite(b.width)&&b.width>0&&b.height>0)return b; }catch(e){}
  const vb=liveSvg.getAttribute('viewBox'); if(vb){ const a=vb.trim().split(/[ ,]+/).map(Number); if(a.length===4)return {x:a[0],y:a[1],width:a[2],height:a[3]}; }
  return {x:0,y:0,width:1000,height:1000};
}
function transformPoint(p,b){
  const minX=Number($('minX').value), minY=Number($('minY').value), maxX=Number($('maxX').value), maxY=Number($('maxY').value);
  const w=maxX-minX,h=maxY-minY; let sx=w/b.width, sy=h/b.height, s=$('centerFit').checked?Math.min(sx,sy):sx;
  let ox=minX+(w-b.width*s)/2-b.x*s, oy=minY+(h-b.height*s)/2-b.y*s;
  let x=p.x*s+ox, y=p.y*s+oy; if($('flipY').checked) y=maxY-(y-minY); return [Math.round(x),Math.round(y)];
}
function pathPoints(path, spacing, maxPts){
  let len=0; try{ len=path.getTotalLength(); }catch(e){ return []; }
  if(!isFinite(len)||len<=0)return [];
  let n;
  if(spacing<=0) n=Math.min(maxPts, Math.max(2, Math.ceil(len/4))); else n=Math.min(maxPts, Math.max(2, Math.ceil(len/spacing)));
  const pts=[]; for(let i=0;i<=n;i++){ const p=path.getPointAtLength(len*i/n); if(!pts.length||Math.hypot(p.x-pts[pts.length-1].x,p.y-pts[pts.length-1].y)>0.01) pts.push({x:p.x,y:p.y}); }
  return pts;
}
function shapePoints(el, spacing, maxPts){
  const tag=el.tagName.toLowerCase();
  if(tag==='path') return pathPoints(el,spacing,maxPts);
  if(tag==='line') return [{x:+el.getAttribute('x1')||0,y:+el.getAttribute('y1')||0},{x:+el.getAttribute('x2')||0,y:+el.getAttribute('y2')||0}];
  if(tag==='polyline'||tag==='polygon'){
    const pts=(el.getAttribute('points')||'').trim().split(/\s+/).map(s=>s.split(',').map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])).map(a=>({x:a[0],y:a[1]}));
    if(tag==='polygon'&&pts.length) pts.push({...pts[0]}); return pts;
  }
  if(tag==='rect'){
    const x=+el.getAttribute('x')||0,y=+el.getAttribute('y')||0,w=+el.getAttribute('width')||0,h=+el.getAttribute('height')||0; return [{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h},{x,y}];
  }
  if(tag==='circle'||tag==='ellipse'){
    const cx=+el.getAttribute('cx')||0,cy=+el.getAttribute('cy')||0,rx=tag==='circle'?(+el.getAttribute('r')||0):(+el.getAttribute('rx')||0),ry=tag==='circle'?rx:(+el.getAttribute('ry')||0); const circ=2*Math.PI*Math.max(rx,ry); const n=Math.min(maxPts,Math.max(16,spacing>0?Math.ceil(circ/spacing):Math.ceil(circ/4))); const pts=[]; for(let i=0;i<=n;i++){const a=2*Math.PI*i/n;pts.push({x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry});} return pts;
  }
  return [];
}
function generateHPGL(){
  if(!liveSvg){setStatus('Load an SVG first.',true);return;}
  const spacing=Number($('spacing').value)||0, maxPathPts=Number($('maxPathPts').value)||1200, maxTotal=Number($('maxTotalPts').value)||25000;
  const bbox=bboxOfSVG(); let total=0, pathCount=0, out=[]; let previewPaths=[];
  const init=$('initMode').value; if(init==='INDFPS4') out.push('IN;','DF;','PS4;',''); else if(init==='INDF') out.push('IN;','DF;','');
  try{
    for(const layer of layers){ if(!layer.enabled) continue; out.push(`SP${layer.pen};`); const els=[...layer.el.querySelectorAll('path,line,polyline,polygon,rect,circle,ellipse')];
      for(const el of els){
        let pts=shapePoints(el,spacing,maxPathPts); if(pts.length<2) continue; pts=pts.map(p=>{ const ctm=el.getCTM(); if(ctm){ const q=liveSvg.createSVGPoint(); q.x=p.x; q.y=p.y; const r=q.matrixTransform(ctm); return {x:r.x,y:r.y}; } return p; });
        const hp=pts.map(p=>transformPoint(p,bbox)); total+=hp.length; pathCount++; if(total>maxTotal){ throw new Error(`Too many points (${total}). Increase sampling distance or max total points.`); }
        out.push(`PU${hp[0][0]},${hp[0][1]};`);
        if($('onePD').checked){ for(let i=1;i<hp.length;i++) out.push(`PD${hp[i][0]},${hp[i][1]};`); }
        else { out.push('PD'+hp.slice(1).map(p=>p[0]+','+p[1]).join(',')+';'); }
        out.push('PU;',''); previewPaths.push({pts:hp,color:layer.color,pen:layer.pen});
      }
    }
    out.push('SP0;'); lastHPGL=out.join('\n'); $('output').value=lastHPGL; $('countInfo').textContent=`${pathCount} paths · ${total} points · ${lastHPGL.length} chars`; window.lastPaths=previewPaths; if($('showHpglPreview').checked) drawHPGLPreview(previewPaths); setStatus(`Generated OK: ${pathCount} paths, ${total} points.`);
  }catch(e){ setStatus(e.message||String(e),true); }
}
function drawHPGLPreview(paths){
  const box=$('hpglPreview'); box.innerHTML=''; if(!paths.length)return;
  const minX=Number($('minX').value), minY=Number($('minY').value), maxX=Number($('maxX').value), maxY=Number($('maxY').value);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('viewBox',`${minX} ${minY} ${maxX-minX} ${maxY-minY}`); svg.setAttribute('width','1000'); svg.setAttribute('height',String(1000*(maxY-minY)/(maxX-minX))); svg.style.overflow='visible';
  const width=Number($('penWidth').value)||0; const sw=width>0?width*40:8;
  paths.forEach(p=>{ const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline'); poly.setAttribute('points',p.pts.map(q=>q.join(',')).join(' ')); poly.setAttribute('fill','none'); poly.setAttribute('stroke',p.color||'#000'); poly.setAttribute('stroke-width',sw); poly.setAttribute('stroke-linecap','round'); poly.setAttribute('stroke-linejoin','round'); svg.appendChild(poly); });
  box.appendChild(svg); applyZoom();
}
function downloadHPGL(){ const text=$('output').value; if(!text){setStatus('Generate HPGL first.',true);return;} const blob=new Blob([text],{type:'text/plain'}); const a=document.createElement('a'); a.download='plot.hpgl'; a.href=URL.createObjectURL(blob); a.click(); URL.revokeObjectURL(a.href); }
</script>
</body>
</html>
